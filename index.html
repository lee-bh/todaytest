    <meta name="description" content="13주차 학생별 과제 제출 현황을 볼 수 있는 심플한 미니멀 대시보드입니다.">
    <link rel="stylesheet" href="style.css">

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 id="main-title">과제 제출 현황판</h1>
            <p class="subtitle" id="subtitle-text">학생별 13주차 과제물 목록 대시보드</p>
        </header>

        <!-- Stats Section -->
        <div class="stats-bar" role="status" aria-label="통계 요약">
            <div class="stat-item">
                <span class="stat-label">수강생:</span>
                <span class="stat-val" id="total-count">0명</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">제출:</span>
                <span class="stat-val" id="submitted-count" style="color: var(--submitted-color);">0명</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">미제출:</span>
                <span class="stat-val" id="unsubmitted-count">0명</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls" aria-label="필터 및 검색">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="이름 또는 학번 검색...">
            </div>
            <div class="filter-tabs" role="tablist">
                <button class="tab-btn active" id="tab-all" role="tab" aria-selected="true"
                    onclick="setFilter('all')">전체</button>
                <button class="tab-btn" id="tab-submitted" role="tab" aria-selected="false"
                    onclick="setFilter('submitted')">제출</button>
                <button class="tab-btn" id="tab-unsubmitted" role="tab" aria-selected="false"
                    onclick="setFilter('unsubmitted')">미제출</button>
            </div>
        </div>

        <!-- Main Card Grid -->
        <main class="card-grid" id="student-grid">
            <!-- Dynamic cards will be rendered here -->
        </main>
    </div>

            { "idx": "26", "major": "시각디자인전공", "studentId": "24101019", "grade": "3", "name": "배수린", "email": "surin041116@gmail.com", "github": "https://github.com/surinie", "w13": "" },
            { "idx": "27", "major": "시각디자인전공", "studentId": "24101041", "grade": "3", "name": "이혜성", "email": "gptjd0472@gmail.com", "github": "https://github.com/comet-ai472", "w13": "13주차-이혜성" },
            { "idx": "28", "major": "금속공예디자인전공", "studentId": "21100847", "grade": "", "name": "강다영", "email": "mingsera@gmail.com", "github": "https://github.com/mingsera-0", "w13": "14주차-강다영" }
        ];

        let currentFilter = 'all';
        let searchQuery = '';

        function getAssignmentLink(student) {
            if (!student.w13 || !student.github || !student.github.startsWith('http')) {
                return '#';
            }
            try {
                const username = student.github.replace('https://github.com/', '').split('/')[0].trim();
                return `https://${username}.github.io/todaytest/`;
            } catch (e) {
                console.error(e);
                return '#';
            }
        }

        function initDashboard() {
            const total = students.length;
            const submitted = students.filter(s => s.w13 !== '').length;
            const unsubmitted = total - submitted;

            document.getElementById('total-count').textContent = `${total}명`;
            document.getElementById('submitted-count').textContent = `${submitted}명`;
            document.getElementById('unsubmitted-count').textContent = `${unsubmitted}명`;

            renderCards();

            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderCards();
            });
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });

            const activeBtn = document.getElementById(`tab-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.setAttribute('aria-selected', 'true');
            }

            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';

            const filtered = students.filter(student => {
                const matchesFilter =
                    currentFilter === 'all' ||
                    (currentFilter === 'submitted' && student.w13 !== '') ||
                    (currentFilter === 'unsubmitted' && student.w13 === '');

                const matchesSearch =
                    student.name.toLowerCase().includes(searchQuery) ||
                    student.studentId.includes(searchQuery) ||
                    student.major.toLowerCase().includes(searchQuery);

                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">해당 학생이 없습니다.</div>`;
                return;
            }

            filtered.forEach(student => {
                const isSubmitted = student.w13 !== '';
                const cardClass = isSubmitted ? 'card submitted' : 'card unsubmitted';
                const badgeClass = isSubmitted ? 'status-badge submitted' : 'status-badge unsubmitted';
                const badgeText = isSubmitted ? '제출 완료' : '미제출';
                const link = getAssignmentLink(student);
                const buttonId = `btn-${student.studentId}`;
                const gradeText = student.grade ? `${student.grade}학년` : '정보 없음';

                const cardHTML = `
                    <article class="${cardClass}" id="card-${student.studentId}">
                        <div>
                            <div class="card-header">
                                <div class="student-info">
                                    <h2 class="student-name">${student.name}</h2>
                                    <span class="student-id">${student.studentId}</span>
                                </div>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="card-body">
                                <div class="info-row">학과: <span>${student.major}</span></div>
                                <div class="info-row">학년: <span>${gradeText}</span></div>
                                ${isSubmitted ? `<div class="info-row">폴더: <span>${student.w13}</span></div>` : ''}
                            </div>
                        </div>
                        <div class="card-footer">
                            ${isSubmitted
                        ? `<a id="${buttonId}" href="${link}" target="_blank" rel="noopener noreferrer" class="link-btn">과제 확인</a>`
                        : `<button id="${buttonId}" class="link-btn" disabled>미제출</button>`
                    }
                        </div>
                    </article>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>

</html>
